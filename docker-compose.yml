services:
  postgres:
    image: postgres:16-alpine
    container_name: ree-auditor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ree}
      POSTGRES_DB: ${POSTGRES_DB:-ree_auditor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ree} -d ${POSTGRES_DB:-ree_auditor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ree-auditor-api
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ree}:${POSTGRES_PASSWORD:-ree}@postgres:5432/${POSTGRES_DB:-ree_auditor}?schema=public
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      OMIE_SIOM2_ENDPOINT: ${OMIE_SIOM2_ENDPOINT:-https://www.mercado.omie.es/jsiom/webServices/SIOMServiceRouter}
      OMIE_SIOM2_P12_PATH: /app/omie-siom2.p12
      OMIE_SIOM2_P12_BASE64: ${OMIE_SIOM2_P12_BASE64:-}
      OMIE_SIOM2_P12_PASSPHRASE: ${OMIE_SIOM2_P12_PASSPHRASE:-}
      OMIE_SIOM2_REJECT_UNAUTHORIZED: ${OMIE_SIOM2_REJECT_UNAUTHORIZED:-true}
      OMIE_SIOM2_DNS_SERVERS: ${OMIE_SIOM2_DNS_SERVERS:-1.1.1.1,8.8.8.8}
      OMIE_SIOM2_TIMEOUT_MS: ${OMIE_SIOM2_TIMEOUT_MS:-30000}
      OMIE_CATALOGO_PATH: ${OMIE_CATALOGO_PATH:-/app/data/omie-catalogo.json}
      REE_ESIOS_PRIVATE_ENABLED: ${REE_ESIOS_PRIVATE_ENABLED:-true}
      REE_ESIOS_PRIVATE_URL: ${REE_ESIOS_PRIVATE_URL:-https://participa.esios.ree.es/ServicioSM/ServiceEME}
      REE_ESIOS_PRIVATE_LQ_URL: ${REE_ESIOS_PRIVATE_LQ_URL:-https://participa.esios.ree.es/ServicioLQ/ServiceEME}
      REE_ESIOS_PRIVATE_TIMEOUT_MS: ${REE_ESIOS_PRIVATE_TIMEOUT_MS:-30000}
      REE_ESIOS_PRIVATE_REJECT_UNAUTHORIZED: "false"
      MIBGAS_PRIVATE_ENVIRONMENT: ${MIBGAS_PRIVATE_ENVIRONMENT:-PREPROD}
      MIBGAS_PRIVATE_ENDPOINT: ${MIBGAS_PRIVATE_ENDPOINT:-}
      MIBGAS_PRIVATE_P12_PATH: /app/mibgas-private.p12
      MIBGAS_PRIVATE_P12_BASE64: ${MIBGAS_PRIVATE_P12_BASE64:-}
      MIBGAS_PRIVATE_P12_PASSPHRASE: ${MIBGAS_PRIVATE_P12_PASSPHRASE:-}
      MIBGAS_PRIVATE_REJECT_UNAUTHORIZED: ${MIBGAS_PRIVATE_REJECT_UNAUTHORIZED:-true}
      MIBGAS_PRIVATE_TIMEOUT_MS: ${MIBGAS_PRIVATE_TIMEOUT_MS:-30000}
      GISCE_BASE_URL: ${GISCE_BASE_URL:-https://api.opcionenergia.gisce.cloud}
      GISCE_BASIC_AUTH: ${GISCE_BASIC_AUTH:-}
      GISCE_BASIC_USERNAME: ${GISCE_BASIC_USERNAME:-}
      GISCE_BASIC_PASSWORD: ${GISCE_BASIC_PASSWORD:-}
      GISCE_CONFIG_ENCRYPTION_KEY: ${GISCE_CONFIG_ENCRYPTION_KEY:-ree-auditor-dev-gisce-config-key-change-me}
      GISCE_API_TOKEN: ${GISCE_API_TOKEN:-}
      GISCE_TIMEOUT_MS: ${GISCE_TIMEOUT_MS:-60000}
      GISCE_INVOICE_DATE_FIELD: ${GISCE_INVOICE_DATE_FIELD:-date_invoice}
      GISCE_INVOICE_PERIOD_START_FIELD: ${GISCE_INVOICE_PERIOD_START_FIELD:-data_inici}
      GISCE_INVOICE_PERIOD_END_FIELD: ${GISCE_INVOICE_PERIOD_END_FIELD:-data_final}
      DATA_DIR: ${DATA_DIR:-/app/data}
      UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR:-/app/data/tmp/uploads}
    ports:
      - "3000:3000"
    volumes:
      - ${OMIE_SIOM2_P12_HOST_PATH:-./certs/omie-siom2.p12}:/app/omie-siom2.p12:ro
      - ${MIBGAS_PRIVATE_P12_HOST_PATH:-./certs/mibgas-private.p12}:/app/mibgas-private.p12:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ree-auditor-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-auto}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
